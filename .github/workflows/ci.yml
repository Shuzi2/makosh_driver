name: Checks
on: [push, pull_request]
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-for-tests-0123456789-abcdefghijklmnopqrstuv
      USE_SQLITE: "1"
      DJANGO_SECURE_COOKIES: "0"
      DJANGO_HTTPS_REDIRECT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2
      - run: docker build -t makosh-fleet:ci .
      - run: docker run --rm -e DJANGO_SECRET_KEY -e USE_SQLITE -e DJANGO_SECURE_COOKIES -e DJANGO_HTTPS_REDIRECT makosh-fleet:ci python manage.py test --verbosity 2
  postgres-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/init_env.py --local
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180 web
      - run: curl --fail http://127.0.0.1:8000/health/
      - run: docker compose exec -T web python manage.py test --verbosity 2
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
