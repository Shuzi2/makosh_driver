{% load static %}<div class="fleet-motion" aria-hidden="true">
  <div class="fleet-motion-halo"></div>
  <div class="fleet-motion-orbit fleet-motion-orbit-one"></div>
  <div class="fleet-motion-orbit fleet-motion-orbit-two"></div>
  <svg class="fleet-motion-road" viewBox="0 0 400 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path class="fleet-motion-path" d="M25 16H375" stroke="#D7DEE2" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3 9"/><circle cx="25" cy="16" r="3" fill="#EBC9B8"/><circle cx="375" cy="16" r="3" fill="#FF5112"/></svg>
  <img class="fleet-motion-truck" src="{% if kind == 'grain' %}{% static 'brand/makosh-grain-smooth.png' %}{% else %}{% static 'brand/makosh-truck-render.png' %}{% endif %}" alt="" decoding="async" width="1774" height="887">
  <svg class="fleet-motion-truck fleet-trailer-wordmark" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <image href="{% static 'brand/makosh-logo.svg' %}" x="0" y="0" width="350" height="88" transform="translate(960 320) skewY(7)" opacity=".87"/>
  </svg>
  {% if kind == 'tent' %}<svg class="fleet-motion-truck fleet-header-badge" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><clipPath id="header-tent-badge-clip"><rect x="252" y="470" width="155" height="45" rx="5"/></clipPath></defs><g clip-path="url(#header-tent-badge-clip)"><image href="{% static 'brand/makosh-truck-render.png' %}" width="1774" height="887" transform="translate(659 0) scale(-1 1)"/></g></svg>{% endif %}
  {% if kind == 'grain' %}<svg class="fleet-motion-truck fleet-grain-badge" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><clipPath id="grain-scania-clip"><rect x="252" y="470" width="155" height="45" rx="5"/></clipPath></defs><image href="{% static 'brand/makosh-truck-render.png' %}" width="1774" height="887" clip-path="url(#grain-scania-clip)"/></svg>{% endif %}
  <svg class="fleet-motion-truck fleet-real-wheel" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    {% include 'fleet/wheel_bolts.html' with x=690 y=738 sx='.667' sy='1' %}
    {% include 'fleet/wheel_bolts.html' with x=1028 y=718 sx='.55' sy='.82' %}
    {% if kind == 'grain' %}
      {% include 'fleet/wheel_bolts.html' with x=1402 y=699 sx='.62' sy='.90' trailer=True %}
      {% include 'fleet/wheel_bolts.html' with x=1490 y=695 sx='.62' sy='.90' trailer=True %}
      {% include 'fleet/wheel_bolts.html' with x=1575 y=691 sx='.62' sy='.90' trailer=True %}
    {% else %}
      {% include 'fleet/wheel_bolts.html' with x=1400 y=691 sx='.62' sy='.90' trailer=True %}
      {% include 'fleet/wheel_bolts.html' with x=1471 y=687 sx='.62' sy='.90' trailer=True %}
      {% include 'fleet/wheel_bolts.html' with x=1542 y=684 sx='.62' sy='.90' trailer=True %}
    {% endif %}
  </svg>
  <svg class="fleet-motion-truck fleet-wheel-layer" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    {% if kind == 'grain' %}
    <g transform="translate(690 738) scale(.68 1)"><circle class="fleet-wheel-glint" r="28"/></g>
    <g transform="translate(1028 718) scale(.66 1)"><circle class="fleet-wheel-glint" r="23"/></g>
    <g transform="translate(1402 699) scale(.65 1)"><circle class="fleet-wheel-glint" r="22"/></g>
    <g transform="translate(1476 695) scale(.65 1)"><circle class="fleet-wheel-glint" r="22"/></g>
    <g transform="translate(1550 691) scale(.65 1)"><circle class="fleet-wheel-glint" r="21"/></g>
    {% else %}
    <g transform="translate(690 738) scale(.68 1)"><circle class="fleet-wheel-glint" r="28"/></g>
    <g transform="translate(1028 718) scale(.66 1)"><circle class="fleet-wheel-glint" r="23"/></g>
    <g transform="translate(1400 691) scale(.65 1)"><circle class="fleet-wheel-glint" r="21"/></g>
    <g transform="translate(1471 687) scale(.65 1)"><circle class="fleet-wheel-glint" r="21"/></g>
    <g transform="translate(1542 684) scale(.65 1)"><circle class="fleet-wheel-glint" r="20"/></g>
    {% endif %}
  </svg>
</div>
