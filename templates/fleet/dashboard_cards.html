{% load static %}{% for group in fleet_groups %}<section class="fleet-group" aria-labelledby="fleet-group-{{ forloop.counter }}"><div class="fleet-group-head"><span class="fleet-group-icon" aria-hidden="true"><img src="{% if group.kind == 'grain' %}{% static 'brand/fleet-grain.svg' %}{% else %}{% static 'brand/fleet-tent.svg' %}{% endif %}" alt=""></span><h2 id="fleet-group-{{ forloop.counter }}">{{ group.label }}</h2><span class="fleet-group-count">{{ group.cards|length }} авто</span></div><div class="truckgrid">{% for card in group.cards %}{% include 'fleet/vehicle_card.html' %}{% empty %}<div class="fleet-empty">У цій категорії ще немає авто.</div>{% endfor %}</div><p class="fleet-search-empty" hidden>За цим запитом авто не знайдено.</p></section>{% endfor %}
