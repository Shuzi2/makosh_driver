<form method="get" class="filters panel trip-list-filters" data-filter-form>
  <label class="trip-filter-field trip-filter-search"><span>Пошук</span><input name="q" value="{{ q }}" placeholder="Авто, водій, маршрут або № ТТН" aria-label="Пошук рейсу"></label>
  <label class="trip-filter-field"><span>Автомобіль</span><select name="vehicle" aria-label="Автомобіль"><option value="">Усі автомобілі</option>{% for item in filter_vehicles %}<option value="{{ item.vehicle_id }}" {% if selected_vehicle == item.vehicle_id|stringformat:'s' %}selected{% endif %}>{{ item.vehicle__plate }}{% if item.vehicle__trailer_plate %} · {{ item.vehicle__trailer_plate }}{% endif %}</option>{% endfor %}</select></label>
  <label class="trip-filter-field"><span>Водій</span><select name="driver" aria-label="Водій"><option value="">Усі водії</option>{% for item in filter_drivers %}<option value="{{ item.driver_id }}" {% if selected_driver == item.driver_id|stringformat:'s' %}selected{% endif %}>{{ item.driver__full_name }}</option>{% endfor %}</select></label>
  <fieldset class="trip-filter-period"><legend>Планова дата рейсу</legend><label><span>Від</span><input type="date" name="date_from" value="{{ date_from }}" aria-label="Планова дата від"></label><label><span>До</span><input type="date" name="date_to" value="{{ date_to }}" aria-label="Планова дата до"></label></fieldset>
  <label class="trip-filter-field"><span>Статус</span><select name="status" aria-label="Статус"><option value="">Усі статуси</option><option value="missing" {% if selected == 'missing' %}selected{% endif %}>Без підписаної ТТН</option>{% for value,label in statuses %}<option value="{{ value }}" {% if selected == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <label class="trip-filter-field"><span>Питання</span><select name="attention" aria-label="Потребує уваги"><option value="">Усі рейси</option><option value="all" {% if attention == 'all' %}selected{% endif %}>Усі питання</option>{% for value,label in attention_options %}<option value="{{ value }}" {% if attention == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
  <label class="trip-filter-field"><span>Сортування</span><select name="sort" aria-label="Сортування рейсів" data-auto-submit><option value="recent" {% if sort == 'recent' %}selected{% endif %}>Спочатку нові</option><option value="vehicle" {% if sort == 'vehicle' %}selected{% endif %}>Авто: А → Я</option><option value="vehicle_desc" {% if sort == 'vehicle_desc' %}selected{% endif %}>Авто: Я → А</option><option value="driver" {% if sort == 'driver' %}selected{% endif %}>Водій: А → Я</option><option value="driver_desc" {% if sort == 'driver_desc' %}selected{% endif %}>Водій: Я → А</option></select></label>
  <div class="trip-filter-actions"><button class="btn primary" type="submit">Показати</button>{% if q or selected or attention or selected_vehicle or selected_driver or date_from or date_to or sort != 'recent' %}<a href="{% url 'trip_list' %}">Скинути фільтри</a>{% endif %}</div>
  {% if filter_error %}<p class="trip-filter-error" role="alert">{{ filter_error }}</p>{% endif %}
</form>
