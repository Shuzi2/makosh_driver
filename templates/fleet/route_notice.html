{% if trip.route_notice and not trip.route_notice_acknowledged_at and trip.status != 'cancelled' and trip.status != 'completed' %}<section class="driver-route-notice"><b>Логіст оновив маршрут</b><p>Перевірте точки, контакти й вказівки перед продовженням.</p><details><summary>Що змінилося</summary><p>{{ trip.route_notice|linebreaksbr }}</p></details><form data-driver-action data-sync-url="{% url 'driver_action' trip.pk %}" data-revision="{{ trip.updated_at|date:'c' }}" method="post" action="{% url 'acknowledge_route' trip.pk %}">{% csrf_token %}<input type="hidden" name="action" value="ack_route"><input type="hidden" name="expected_revision" value="{{ trip.updated_at|date:'c' }}"><button class="driver-small-button" type="submit">Ознайомився зі змінами ✓</button></form></section>{% endif %}
