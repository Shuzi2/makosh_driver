<article class="truck"><div class="truck-head"><div><b>{{ trip.vehicle.plate }}</b><small>{{ trip.vehicle.trailer_plate }} · {{ trip.vehicle.get_kind_display }}</small></div><span class="badge {{ trip.status }}">{{ trip.get_status_display }}</span></div><a class="route" href="{% url 'trip_detail' trip.pk %}">{{ trip.origin }} <span>→</span> {{ trip.destination }}</a><p class="muted">{{ trip.cargo }} · {{ trip.planned_tons }} т · {{ trip.planned_date|date:'d.m.Y' }}</p><a class="btn primary full" href="{% url 'trip_detail' trip.pk %}">Відкрити рейс →</a></article>
