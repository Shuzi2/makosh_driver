<form class="driver-rest-form" data-driver-action data-driver-rest data-sync-url="{% url 'driver_rest' %}" data-revision="{{ user.rest_changed_at|date:'c' }}" method="post" action="{% url 'driver_rest' %}">{% csrf_token %}<input type="hidden" name="rest" value="{% if user.rest_started_at %}end{% else %}start{% endif %}"><input type="hidden" name="return_to" value="{{ request.get_full_path }}"><button class="driver-rest-button {% if user.rest_started_at %}is-resting{% endif %}" type="submit" aria-label="{% if user.rest_started_at %}Завершити відпочинок і продовжити роботу{% else %}Почати паузу або відпочинок{% endif %}"><span aria-hidden="true">{% if user.rest_started_at %}▶{% else %}Ⅱ{% endif %}</span>{% if user.rest_started_at %}Продовжити<br>роботу{% else %}Пауза /<br>Відпочинок{% endif %}</button></form>
