<ol class="{{ progress_class|default:'dispatcher-stage-grid' }}" aria-label="Етапи рейсу">{% for step in driver_steps %}<li class="{% if step.done %}done{% elif step.current %}current{% endif %}" {% if step.current %}aria-current="step"{% endif %}><span aria-hidden="true">{% if step.done %}✓{% else %}{{ forloop.counter }}{% endif %}</span><b>{{ step.label }}</b>{% if step.current %}<small>{% if trip.driver.rest_started_at %}Пауза{% else %}Зараз{% endif %}</small>{% endif %}</li>{% endfor %}</ol>
