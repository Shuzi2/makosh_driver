<dialog class="quick-edit-dialog" data-quick-dialog aria-labelledby="quick-edit-title"><div class="quick-dialog-heading"><div><small>Рейс №{{ trip.pk }}</small><h2 id="quick-edit-title">Редагування</h2></div><button class="dialog-close" type="button" data-close-edit aria-label="Закрити редагування">×</button></div><p class="quick-dialog-hint">Зміни збережуться в даних рейсу та його історії.</p>{% for editor in quick_editors %}<div data-edit-panel="{{ editor.key }}" data-edit-title="{{ editor.title }}" hidden><form method="post" action="{% url 'trip_quick_edit' trip.pk editor.key %}">{% csrf_token %}{% include 'fleet/quick_edit_fields.html' with form=editor.form %}<div class="quick-dialog-actions"><button class="btn" type="button" data-close-edit>Скасувати</button><button class="btn primary" type="submit">Зберегти зміни</button></div></form></div>{% endfor %}</dialog>
