{% load l10n %}{% if lat != None and lon != None %}<details class="location-preview" data-location-preview data-lat="{{ lat|unlocalize }}" data-lon="{{ lon|unlocalize }}" data-tile-url="{{ map_tile_url }}" data-attribution="{{ map_tile_attribution }}"><summary><span class="location-preview-icon" aria-hidden="true">⌖</span><span>Карта місця<small>Точний заїзд від логіста</small></span><span class="location-preview-toggle" aria-hidden="true">＋</span></summary><div class="location-preview-map" data-preview-map></div></details>{% endif %}
