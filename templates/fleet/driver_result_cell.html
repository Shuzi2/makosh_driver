{% if cell.kind == 'live' %}<td class="sheet-result-editable" data-formula="1" data-result="{{ cell.key }}" data-field="{{ cell.key }}" data-value="{{ cell.manual }}" data-url="{% url 'driver_report_fuel_rate' cell.trip_pk %}" data-revision="{{ cell.revision }}" title="Ручне виправлення лише у звіті; порожнє значення повертає формулу"><button type="button" class="sheet-cell-button" aria-label="Змінити розрахункове значення"><span>{{ cell.value|floatformat:2|default:'—' }}</span><i aria-hidden="true">✎</i></button></td>{% else %}<td class="sheet-result-editable" data-formula="1" data-result="{{ cell.key }}" data-field="{{ cell.field }}" data-value="{{ cell.manual }}" data-url="{% url 'driver_report_archive_cell' cell.row_pk %}" data-revision="{{ cell.revision }}" title="Ручне виправлення лише у звіті; порожнє значення повертає оригінал"><button type="button" class="sheet-cell-button" aria-label="Змінити розрахункове значення"><span>{{ cell.value|default_if_none:'—' }}</span><i aria-hidden="true">✎</i></button></td>{% endif %}
