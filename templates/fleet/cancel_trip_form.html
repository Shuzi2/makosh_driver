<details class="cancel-trip"><summary>Скасувати рейс</summary><form method="post" action="{% url 'trip_status' trip.pk %}">{% csrf_token %}<input type="hidden" name="status" value="cancelled"><input type="hidden" name="revision" value="{{ trip.updated_at|date:'c' }}"><label for="cancel-reason-{{ trip.pk }}">Причина для водія (необов’язково)</label><textarea id="cancel-reason-{{ trip.pk }}" name="cancellation_reason" maxlength="500" rows="2" placeholder="Наприклад, завантаження скасоване"></textarea><p class="hint">Залиште порожньо, якщо пояснення не потрібне. Водій побачить повідомлення та має підтвердити, що ознайомився.</p><button class="btn danger" type="submit" data-confirm-title="Скасувати рейс №{{ trip.pk }}?" data-confirm-detail="Рейс буде скасовано. Водій отримає повідомлення та має підтвердити, що ознайомився.">Скасувати рейс</button></form></details>
